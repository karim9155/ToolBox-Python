name: Build and Deploy

on:
  push:
    branches: [ "master" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: karimkli
        password: ${{ secrets.DOCKERHUB_TOKEN }}
        
    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: karimkli/toolbox-api:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
    - name: Deploy to OVH VM
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: 54.37.78.55
        username: ubuntu
        key: ${{ secrets.OVH_SSH_KEY }}
        script: |
          # Pull the new image
          docker pull karimkli/toolbox-api:latest
          
          # Stop and remove the existing container
          docker stop toolbox-api || true
          docker rm toolbox-api || true
          
          # Run the new container
          docker run -d \
            -p 8000:8000 \
            --name toolbox-api \
            --restart unless-stopped \
            -e ASSEMBLYAI_API_KEY=${{ secrets.ASSEMBLYAI_API_KEY }} \
            -e GOOGLE_TTS_API_KEY=${{ secrets.GOOGLE_TTS_API_KEY }} \
            -e TOOLBOX_CALLBACK_SECRET=${{ secrets.TOOLBOX_CALLBACK_SECRET }} \
            -e ALLOWED_CALLBACK_DOMAINS=${{ secrets.ALLOWED_CALLBACK_DOMAINS }} \
            -e CALLBACK_TIMEOUT=30 \
            -e MAX_CALLBACK_RETRIES=3 \
            -e DEPLOYMENT_ENV=prod \
            -e SUPABASE_PREPROD_URL=${{ secrets.SUPABASE_PREPROD_URL }} \
            -e SUPABASE_PREPROD_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_PREPROD_SERVICE_ROLE_KEY }} \
            -e SUPABASE_PROD_URL=${{ secrets.SUPABASE_PROD_URL }} \
            -e SUPABASE_PROD_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_PROD_SERVICE_ROLE_KEY }} \
            -e SUPABASE_STORAGE_BUCKET=videos \
            karimkli/toolbox-api:latest
