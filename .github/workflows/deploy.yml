name: Build and Deploy

on:
  push:
    branches: [ "master" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.karimkli }}
        password: ${{ secrets.dckr_pat_4AZ2rNfbBuK-55LzCRH9Dhro-3U }}
        
    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: karimkli/toolbox-api:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
