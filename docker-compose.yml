version: '3.8'

services:
  api:
    build: .
    container_name: toolbox-api
    ports:
      - "8000:8000"
    volumes:
      - .:/code
    environment:
      - ASSEMBLYAI_API_KEY=${ASSEMBLYAI_API_KEY:-c3e32648f5044e319c10eba6142bf280}
      - GOOGLE_VERTEX_PROJECT=${GOOGLE_VERTEX_PROJECT}
      - GOOGLE_VERTEX_LOCATION=${GOOGLE_VERTEX_LOCATION:-europe-west1}
      - GOOGLE_APPLICATION_CREDENTIALS=/code/gen-lang-client-0637559951-6ab5fc474416.json
    restart: unless-stopped
